name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint
      - run: make test-short

  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [pgdialect, mysqldialect, sqlitedialect, mssqldialect]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Integration tests (testcontainers)
        working-directory: dialect/${{ matrix.module }}
        run: go test -race -count=1 -timeout 20m ./...
